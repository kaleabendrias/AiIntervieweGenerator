services:
  - type: web
    name: interview-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        value: https://interview-frontend.onrender.com
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_TIMEOUT_MS
        value: 15000
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_ANON_MAX
        value: 10
      - key: RATE_LIMIT_AUTH_MAX
        value: 60

  - type: web
    name: interview-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    plan: starter
    envVars:
      - key: VITE_API_URL
        value: https://interview-backend.onrender.com